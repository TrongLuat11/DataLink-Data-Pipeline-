<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập — DataLink Control Plane</title>
    <!-- Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --bg-page: #fafafa;
            --bg-card: #ffffff;
            --text-main: #09090b;
            --text-muted: #71717a;
            --border-light: #e4e4e7;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-mono: 'JetBrains Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }

        body {
            background-color: var(--bg-page);
            font-family: var(--font-sans);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
        }

        .login-card {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            padding: 36px 32px;
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
        }

        .brand-icon {
            width: 40px;
            height: 40px;
            background: #000000;
            color: #ffffff;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            margin-bottom: 16px;
        }

        .form-label-custom {
            font-size: 0.72rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
            margin-bottom: 6px;
            display: block;
        }

        .form-control-custom {
            width: 100%;
            padding: 10px 14px;
            font-size: 0.9rem;
            border: 1px solid var(--border-light);
            border-radius: 6px;
            background-color: #ffffff;
            color: var(--text-main);
            transition: all 0.15s ease;
        }

        .form-control-custom:focus {
            border-color: #000000;
            outline: none;
            box-shadow: 0 0 0 1px #000000;
        }

        .btn-submit {
            width: 100%;
            background: #000000;
            color: #ffffff;
            border: 1px solid #000000;
            padding: 11px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.15s ease;
            margin-top: 8px;
        }

        .btn-submit:hover {
            background: #27272a;
            border-color: #27272a;
        }

        .alert-minimal {
            background: #f4f4f5;
            border: 1px solid #d4d4d8;
            color: #09090b;
            font-size: 0.85rem;
            padding: 10px 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .font-mono {
            font-family: var(--font-mono);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <!-- BRANDING -->
            <div class="text-center mb-4">
                <div class="brand-icon">
                    <i class="bi bi-box-fill"></i>
                </div>
                <h4 class="fw-bold mb-1" style="letter-spacing: -0.02em;">DataLink Control</h4>
                <p class="text-muted small mb-0">Hệ thống Quản trị & Điều phối Pipeline Dữ liệu</p>
            </div>

            <!-- ERROR ALERT -->
            {% if error %}
            <div class="alert-minimal">
                <i class="bi bi-exclamation-circle-fill"></i>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <!-- FORM -->
            <form method="POST" action="/login">
                <div class="mb-3">
                    <label class="form-label-custom">Tên đăng nhập</label>
                    <input type="text" name="username" class="form-control-custom font-mono" placeholder="admin" required autofocus>
                </div>
                <div class="mb-4">
                    <label class="form-label-custom">Mật khẩu</label>
                    <input type="password" name="password" class="form-control-custom" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-submit">
                    Đăng Nhập <i class="bi bi-arrow-right ms-1"></i>
                </button>
            </form>

            <div class="mt-4 pt-3 border-top text-center text-muted font-mono" style="font-size: 0.75rem;">
                DataLink Platform • Medallion MDS
            </div>
        </div>
    </div>
</body>
</html>
